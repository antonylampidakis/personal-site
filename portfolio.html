  <script>

      // Tabs filter + CityFilm section toggle
      const tabs = document.querySelectorAll(".tab");
      const photos = document.querySelectorAll(".photo");
      const grid = document.getElementById("grid");
      const cityfilmSection = document.getElementById("cityfilmSection");

      tabs.forEach(tab => {
        tab.addEventListener("click", () => {
          tabs.forEach(t => t.classList.remove("is-active"));
          tab.classList.add("is-active");

          const filter = tab.dataset.filter;

          // ✅ CityFilm: κρύψε grid, δείξε section
          if (filter === "cityfilm") {
            grid.style.display = "none";
            cityfilmSection.hidden = false;
            return;
          }

          // ✅ Photos: δείξε grid, κρύψε CityFilm
          cityfilmSection.hidden = true;
          grid.style.display = "";

          photos.forEach(p => {
            const cat = p.dataset.cat;
            const show = (filter === "all") || (cat === filter);
            p.style.display = show ? "" : "none";
          });
        });
      });


    // Lightbox
    const lb = document.getElementById("lightbox");
    const lbImg = document.getElementById("lbImg");
    const lbTitle = document.getElementById("lbTitle");
    const lbDesc = document.getElementById("lbDesc");

    document.querySelectorAll(".photo__btn").forEach(btn => {
      btn.addEventListener("click", () => {
        lbImg.src = btn.dataset.full;
        lbImg.alt = btn.dataset.title || "Photo";
        lbTitle.textContent = btn.dataset.title || "";
        lbDesc.textContent = btn.dataset.desc || "";
        lb.classList.add("is-open");
        lb.setAttribute("aria-hidden", "false");
        document.body.style.overflow = "hidden";
      });
    });

    lb.addEventListener("click", (e) => {
      if (e.target.dataset.close) closeLb();
    });

    window.addEventListener("keydown", (e) => {
      if (e.key === "Escape") closeLb();
    });

    function closeLb(){
      lb.classList.remove("is-open");
      lb.setAttribute("aria-hidden", "true");
      lbImg.src = "";
      document.body.style.overflow = "";
    }

    // Theme toggle
    const themeBtn = document.getElementById("themeBtn");
    themeBtn.addEventListener("click", () => {
      document.body.classList.toggle("dark");
    });

    // Mobile menu toggle
    const menuBtn = document.getElementById("menuBtn");
    const mobileMenu = document.getElementById("mobileMenu");

    menuBtn.addEventListener("click", () => {
      const isOpen = mobileMenu.classList.toggle("is-open");
      menuBtn.classList.toggle("is-open", isOpen);
      menuBtn.setAttribute("aria-expanded", isOpen ? "true" : "false");
    });

    // Close menu when clicking a link
    mobileMenu.querySelectorAll("a").forEach(a => {
      a.addEventListener("click", () => {
        mobileMenu.classList.remove("is-open");
        menuBtn.classList.remove("is-open");
        menuBtn.setAttribute("aria-expanded", "false");
      });
    });

     
  </script>
